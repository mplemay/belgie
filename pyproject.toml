[project]
name = "belgie"
version = "0.1.1"
description = "The generative AI/UI sandbox for python"
readme = "readme.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
cli = [
    "rtoml>=0.13,<1",
    "tomlkit>=0.13,<1",
    "typer>=0.20,<1",
]
pydantic-ai = [
    "anyio>=4",
    "pydantic-ai-slim[openai]>=2,<3",
]
langchain = [
    "langchain>=1,<2",
]
mcp = [
    "mcp>=2.0.0rc1",
    "mcp-types>=2.0.0rc1",
    "pydantic>=2,<3",
]

[project.scripts]
belgie = "belgie.cli.__main__:main"
belgie-runtime = "belgie._child_process:main"

[dependency-groups]
dev = [
    "anyio>=4",
    "fastapi>=0.140.0",
    "langchain>=1,<2",
    "langchain-openai>=0.3,<1",
    "mcp>=2",
    "mcp-types>=2",
    "pydantic-ai-slim[openai]>=2,<3",
    "prek>=0.4.4",
    "pytest>=9.0.3",
    "rtoml>=0.13,<1",
    "ruff>=0.16.0",
    "rumdl>=0.2.43",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.0.0",
    "tomlkit>=0.13,<1",
    "typer>=0.20,<1",
    "ty>=0.0.63",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
    "zizmor>=1.25.2",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/belgie-py/Cargo.toml"
module-name = "belgie._core"
python-packages = ["belgie"]
python-source = "src"
exclude = ["**/__tests__/**"]
features = ["extension-module"]

[tool.belgie.dependencies]
oxlint = "npm:oxlint@^1.76.0"
oxfmt = "npm:oxfmt@^0.61.0"
oxlint-tsgolint = "npm:oxlint-tsgolint@^7.0.2001"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]
exclude-newer = "7 days"
exclude-newer-package = { pydantic-ai-slim = false, pydantic-graph = false, pydantic-evals = false, mcp = false, mcp-types = false }

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["pyproject.toml"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",    # pydocstyle (i.e. ignore missing/malformed docstrings)
    "CPY",  # flake8-copyright (project does not use copyright headers)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused (common in __init__.py to re-export symbols)
    "T201", # print is intentional in CLI entry points
]
"**/__tests__/**/*" = [
    "ANN001",  # missing type annotation for function argument
    "ANN201",  # missing return type annotation for public function
    "ANN202",  # missing return type annotation for private function
    "B008",    # function call in argument defaults (required for FastAPI Depends)
    "F841",    # local variable assigned but never used
    "FAST002", # FastAPI dependency without Annotated
    "INP001",  # implicit namespace package (tests dir may not need __init__.py)
    "PLR0913", # too many arguments in function definition
    "PLR2004", # magic value used in comparison (fine in test cases)
    "S101",    # use of assert (tests typically use assert directly)
    "S106",    # possible hardcoded password (test secrets are fine)
    "SLF001",  # private member accessed
    "ANN401",  # mock helpers intentionally accept flexible kwargs
    "ARG001",  # fixtures used only for skip side effects
    "PT017",   # SystemExit assertions in CLI harness helpers
    "RUF043",  # pytest match patterns for CLI error messages
    "TC002",   # pytest imported at runtime in test modules
    "TC003",   # pathlib imported at runtime in test modules
]
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
anyio_mode = "auto"
addopts = ["-p", "no:langsmith_plugin"]
testpaths = ["src/belgie/__tests__"]
norecursedirs = ["target", "dist", "build", ".venv", "node_modules"]
markers = [
    "integration: marks tests that hit the database or external services",
]
filterwarnings = [
    "error",
    # langsmith 0.10.15+ calls asyncio.iscoroutinefunction at import time;
    # deprecated on 3.14. Remove once langsmith-sdk#3347 is released.
    "ignore::DeprecationWarning:langsmith._internal._beta_decorator",
]


[tool.rumdl]
line_length = 120

[tool.rumdl.MD013]
reflow = true
code_blocks = false
tables = false
