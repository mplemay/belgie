[package]
name = "belgie-node"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
belgie-pool = { path = "../belgie-pool" }
libc = "0.2"
napi = { version = "3", features = ["async"] }
napi-derive = "3"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }

[build-dependencies]
napi-build = "2"
