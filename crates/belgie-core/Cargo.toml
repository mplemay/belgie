[package]
name = "belgie-core"
version = "0.1.0"
edition = "2024"

[dependencies]
deno_ast = { version = "=0.53.3", features = ["transpiling", "visit"] }
deno_core = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", features = ["v8"] }
deno_error = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
