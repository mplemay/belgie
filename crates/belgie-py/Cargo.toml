[package]
name = "belgie-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module", "belgie/extension-module"]

[dependencies]
belgie = { path = "../belgie" }
deno_cache_dir = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", features = ["sync"] }
deno_config = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", features = ["sync", "workspace"] }
deno_core = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", features = ["v8"] }
deno_lib = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5" }
deno_npm_installer = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5" }
deno_resolver = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", features = ["sync", "graph", "deno_ast"] }
deno_runtime = { git = "https://github.com/denoland/deno.git", tag = "v2.9.5", default-features = false, features = ["transpile"] }
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29", features = ["attributes", "tokio-runtime"] }
serde_json = "1.0.151"
sys_traits = { version = "0.1.28", features = ["getrandom", "real", "libc", "winapi"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread"] }
url = "2.5.8"
