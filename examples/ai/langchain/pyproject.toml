[project]
name = "langchain-example"
version = "0.1.0"
description = "LangChain capability example for belgie"
readme = "readme.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "belgie[langchain]",
    "langchain-openai>=0.3,<1",
]

[project.scripts]
main = "langchain_example.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"


[tool.uv.exclude-newer-package]
annotated-types = false
anyio = false
belgie = false
certifi = false
charset-normalizer = false
jiter = false
langchain = false
langchain-core = false
langchain-openai = false
langgraph = false
langsmith = false
openai = false
regex = false
tqdm = false
typing-extensions = false
uuid-utils = false
websockets = false
xxhash = false
[tool.uv.sources]
belgie = { path = "../../../", editable = true }
