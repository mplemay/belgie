version = 1
revision = 3
requires-python = ">=3.12, <3.15"

[options]
exclude-newer = "0001-01-01T00:00:00Z" # This has no effect and is included for backwards compatibility when using relative exclude-newer values.
exclude-newer-span = "P7D"

[options.exclude-newer-package]
belgie = false

[[package]]
name = "belgie"
version = "0.1.1"
source = { editable = "../../../" }

[package.metadata]
requires-dist = [
    { name = "langchain", marker = "extra == 'langchain'", specifier = ">=1,<2" },
    { name = "mcp", marker = "extra == 'mcp'", specifier = ">=2.0.0rc1" },
    { name = "mcp-types", marker = "extra == 'mcp'", specifier = ">=2.0.0rc1" },
    { name = "pydantic", marker = "extra == 'mcp'", specifier = ">=2,<3" },
    { name = "pydantic-ai-slim", extras = ["openai"], marker = "extra == 'pydantic-ai'", specifier = ">=2,<3" },
    { name = "rtoml", marker = "extra == 'cli'", specifier = ">=0.13,<1" },
    { name = "tomlkit", marker = "extra == 'cli'", specifier = ">=0.13,<1" },
    { name = "typer", marker = "extra == 'cli'", specifier = ">=0.20,<1" },
]
provides-extras = ["cli", "pydantic-ai", "langchain", "mcp"]

[package.metadata.requires-dev]
dev = [
    { name = "anyio", specifier = ">=4" },
    { name = "fastapi", specifier = ">=0.141.1" },
    { name = "langchain", specifier = ">=1,<2" },
    { name = "langchain-openai", specifier = ">=0.3,<1" },
    { name = "mcp", specifier = ">=2" },
    { name = "mcp-types", specifier = ">=2" },
    { name = "prek", specifier = ">=0.4.4" },
    { name = "pydantic-ai-slim", extras = ["openai"], specifier = ">=2,<3" },
    { name = "pytest", specifier = ">=9.0.3" },
    { name = "rtoml", specifier = ">=0.13,<1" },
    { name = "ruff", specifier = ">=0.16.1" },
    { name = "rumdl", specifier = ">=0.2.48" },
    { name = "tomlkit", specifier = ">=0.13,<1" },
    { name = "ty", specifier = ">=0.0.65" },
    { name = "typer", specifier = ">=0.20,<1" },
    { name = "uvloop", marker = "sys_platform != 'win32'", specifier = ">=0.22.1" },
    { name = "zizmor", specifier = ">=1.25.2" },
]

[[package]]
name = "jsr-deps"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "belgie" },
]

[package.metadata]
requires-dist = [{ name = "belgie", editable = "../../../" }]
