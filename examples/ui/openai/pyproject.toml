[project]
name = "openai-app"
version = "0.1.0"
description = "ChatGPT plugin extensions example for belgie"
readme = "readme.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "belgie[mcp,cli]",
    "openai-mcp-extensions>=0.1,<0.2",
    "uvicorn>=0.38,<1",
]

[project.scripts]
main = "openai_app.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { belgie = false, mcp = false, mcp-types = false, openai-mcp-extensions = false, uvicorn = false }

[tool.uv.sources]
belgie = { path = "../../../", editable = true }

[tool.belgie]
source = "src"

[tool.belgie.typescript]
target = "openai_app.__main__:mcp"
output = "src/openai_app/views/widgets/tools.ts"

[tool.belgie.dependencies]
"@belgie/mcp" = "file:../../../packages/mcp"
"@belgie/vite" = "file:../../../packages/vite"
"@modelcontextprotocol/ext-apps" = "npm:@modelcontextprotocol/ext-apps@^2.0.3"
"@modelcontextprotocol/sdk" = "npm:@modelcontextprotocol/sdk@^1.32.1"
"@openai/mcp-extensions" = "npm:@openai/mcp-extensions@^0.1.0"
"@types/react" = "npm:@types/react@^19.3.0"
"@types/react-dom" = "npm:@types/react-dom@^19.3.0"
"@vitejs/plugin-react" = "npm:@vitejs/plugin-react@^6.1.2"
react = "npm:react@^19.3.0"
"react-dom" = "npm:react-dom@^19.3.0"
"react-dom/client" = "npm:react-dom@^19.3.0"
vite = "npm:vite@8.3.4"
