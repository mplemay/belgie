[project]
name = 'tanstack'
version = '0.1.0'
description = 'TanStack Start and FastAPI MCP widget example for Belgie'
readme = 'readme.md'
requires-python = '>=3.12,<3.15'
dependencies = [
    'belgie[mcp,cli]',
    'fastapi[standard]>=0.139,<1',
]

[[project.authors]]
name = 'Matt LeMay'
email = 'mplemay@users.noreply.github.com'

[build-system]
build-backend = 'uv_build'
requires = ['uv_build>=0.11,<0.12']
[tool.fastapi]
entrypoint = 'tanstack.__main__:app'

[tool.uv]
exclude-newer = '7 days'

[tool.uv.exclude-newer-package]
belgie = false
fastapi = false
mcp = false
mcp-types = false
[tool.uv.sources.belgie]
path = '../../../'
editable = true
[tool.belgie]
module = true
[tool.belgie.dependencies]
"@belgie/mcp" = 'file:../../../packages/mcp'
"@belgie/vite" = 'file:../../../packages/vite'
"@modelcontextprotocol/ext-apps" = 'npm:@modelcontextprotocol/ext-apps@^1.7.5'
"@modelcontextprotocol/sdk" = 'npm:@modelcontextprotocol/sdk@^1.30.0'
"@tanstack/react-router" = 'npm:@tanstack/react-router@^1.170.18'
"@tanstack/react-router/ssr/server" = 'npm:@tanstack/react-router@^1.170.18'
"@tanstack/react-start" = 'npm:@tanstack/react-start@^1.168.34'
"@tanstack/react-start/plugin/vite" = 'npm:@tanstack/react-start@^1.168.34'
"@types/node" = 'npm:@types/node@^26.1.2'
"@types/react" = 'npm:@types/react@^19.2.18'
"@types/react-dom" = 'npm:@types/react-dom@^19.2.4'
"@vitejs/plugin-react" = 'npm:@vitejs/plugin-react@^6.0.5'
react = 'npm:react@^19.2.8'
"react/jsx-dev-runtime" = 'npm:react@^19.2.8'
"react/jsx-runtime" = 'npm:react@^19.2.8'
react-dom = 'npm:react-dom@^19.2.8'
"react-dom/client" = 'npm:react-dom@^19.2.8'
"react-dom/server" = 'npm:react-dom@^19.2.8'
typescript = 'npm:typescript@^7.0.2'
vite = 'npm:vite@8.2.0'
