site_name: Belgie
site_description: The generative AI/UI sandbox for python
strict: true
site_url: https://mplemay.github.io/belgie/

repo_name: mplemay/belgie
repo_url: https://github.com/mplemay/belgie
edit_uri: edit/main/docs/

nav:
  - Overview:
      - Home: index.md
      - Install: install.md
      - Help: help.md
      - Troubleshooting: troubleshooting.md
  - Core Concepts:
      - Runtime: runtime.md
      - Script: script.md
      - Environment: environment.md
      - Command: command.md
  - Integrations:
      - MCP Apps: mcp-apps.md
      - AI Agents:
          - Overview: agents/overview.md
          - Pydantic AI: agents/pydantic-ai.md
          - LangChain: agents/langchain.md
  - CLI: cli.md
  - Packages:
      - "@belgie/mcp": packages/mcp.md
      - "@belgie/render": packages/render.md
  - Examples:
      - Overview: examples/index.md
      - Basic Runtime: examples/basic.md
      - MCP Apps: examples/mcp.md
      - AI Agents: examples/ai-agents.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md

exclude_docs: |
  agents.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mplemay/belgie

extra_css:
  - extra/tweaks.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - toc.follow

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tilde
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra:
      pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - sane_lists

plugins:
  - search
